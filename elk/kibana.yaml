apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: telealert-kibana
  namespace: default
spec:
  version: 8.13.0
  count: 1
  elasticsearchRef:
    name: telealert-es
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 500m

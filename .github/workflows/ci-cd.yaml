name: TeleAlert CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flask psycopg2-binary prometheus-client pytest

      - name: Run syntax check
        run: |
          python -m py_compile api/app.py
          python -m py_compile worker/worker.py
          echo "Syntax check passed"

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/telealert-api:latest

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/telealert-worker:latest

  deploy:
    name: Deploy Notification
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment summary
        run: |
          echo "TeleAlert deployment complete"
          echo "API image pushed to GHCR"
          echo "Worker image pushed to GHCR"
          echo "API: ghcr.io/${{ github.repository_owner }}/telealert-api:latest"
          echo "Worker: ghcr.io/${{ github.repository_owner }}/telealert-worker:latest"
name: TeleAlert CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flask psycopg2-binary prometheus-client pytest anthropic requests

      - name: Run syntax check
        run: |
          python -m py_compile api/app.py
          python -m py_compile worker/worker.py
          echo "Syntax check passed"

      - name: Explain failure with Claude
        if: failure()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'EOF'
          import anthropic
          import os

          error_log = """
          GitHub Actions CI/CD pipeline failed during Run Tests stage.
          Job: Run Tests
          Branch: main
          Repository: AbhiBounteous/telealert
          Error: Syntax check or dependency installation failed.
          """

          api_key = os.environ["ANTHROPIC_API_KEY"].strip()
          client = anthropic.Anthropic(api_key=api_key)
          message = client.messages.create(
              model="claude-sonnet-4-6",
              max_tokens=500,
              messages=[{
                  "role": "user",
                  "content": f"""You are a senior DevOps engineer at Bounteous.
                  A CI/CD pipeline has failed. Analyze this error and explain:
                  1. What went wrong in simple terms
                  2. Exact steps to fix it
                  3. How to prevent it next time

                  Error details:
                  {error_log}"""
              }]
          )
          print("=" * 60)
          print("CLAUDE AI FAILURE ANALYSIS")
          print("=" * 60)
          print(message.content[0].text)
          print("=" * 60)
          EOF

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ghcr.io/abhibounteous/telealert-api:latest

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: ghcr.io/abhibounteous/telealert-worker:latest

      - name: Explain failure with Claude
        if: failure()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'EOF'
          import anthropic
          import os

          error_log = """
          GitHub Actions CI/CD pipeline failed during Build and Push stage.
          Job: Build and Push Docker Images
          Branch: main
          Repository: AbhiBounteous/telealert
          Error: Docker build or push to GHCR failed.
          """

          api_key = os.environ["ANTHROPIC_API_KEY"].strip()
          client = anthropic.Anthropic(api_key=api_key)
          message = client.messages.create(
              model="claude-sonnet-4-6",
              max_tokens=500,
              messages=[{
                  "role": "user",
                  "content": f"""You are a senior DevOps engineer at Bounteous.
                  A Docker build or push failed in CI/CD. Analyze and explain:
                  1. What went wrong in simple terms
                  2. Exact steps to fix it
                  3. How to prevent it next time

                  Error details:
                  {error_log}"""
              }]
          )
          print("=" * 60)
          print("CLAUDE AI FAILURE ANALYSIS")
          print("=" * 60)
          print(message.content[0].text)
          print("=" * 60)
          EOF

  deploy:
    name: Deploy Notification
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment summary
        run: |
          echo "TeleAlert deployment complete"
          echo "API image pushed to GHCR"
          echo "Worker image pushed to GHCR"
          echo "API: ghcr.io/abhibounteous/telealert-api:latest"
          echo "Worker: ghcr.io/abhibounteous/telealert-worker:latest"

      - name: Set up Python for AI summary
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install anthropic
        run: pip install anthropic

      - name: Claude deployment summary
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'EOF'
          import anthropic
          import os

          api_key = os.environ["ANTHROPIC_API_KEY"].strip()
          client = anthropic.Anthropic(api_key=api_key)
          message = client.messages.create(
              model="claude-sonnet-4-6",
              max_tokens=200,
              messages=[{
                  "role": "user",
                  "content": """You are a DevOps bot. Generate a one paragraph
                  deployment success summary for TeleAlert v1.2 — a telecom network
                  event processing system just deployed to Kubernetes at
                  Bounteous × Telecom & Media Practice.
                  Be professional and concise."""
              }]
          )
          print("=" * 60)
          print("CLAUDE AI DEPLOYMENT SUMMARY")
          print("=" * 60)
          print(message.content[0].text)
          print("=" * 60)
          EOF
name: Claude DevOps PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install anthropic
        run: pip install anthropic
      - name: Claude DevOps Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/diff.txt
          python3 -c "
          import anthropic, os
          client = anthropic.Anthropic()
          diff = open('/tmp/diff.txt').read()[:8000]
          r = client.messages.create(
              model='claude-sonnet-4-6',
              max_tokens=1000,
              messages=[{'role':'user','content':f'Review this DevOps PR diff for security issues, missing resource limits, latest tags:\n{diff}'}]
          )
          review = r.content[0].text
          print(review)
          open('/tmp/review.txt','w').write(review)
          "
      - name: Post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$(cat /tmp/review.txt)"
name: Claude DevOps PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        run: |
          git diff --name-only \
            origin/${{ github.base_ref }}...HEAD \
            > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

      - name: Get diff content
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- '*.yaml' '*.yml' '*.tf' \
               '*.py' 'Dockerfile*' \
            > /tmp/pr_diff.txt
          echo "Diff size: $(wc -l < /tmp/pr_diff.txt) lines"

      - name: Install anthropic
        run: pip install anthropic

      - name: Claude DevOps Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 << 'PYTHON'
          import anthropic, os

          client = anthropic.Anthropic()

          with open('/tmp/pr_diff.txt') as f:
              diff = f.read()[:12000]

          with open('/tmp/changed_files.txt') as f:
              changed_files = f.read()

          prompt = f"""You are a Senior DevOps Engineer reviewing a PR for TeleAlert.

PR Title: {os.environ['PR_TITLE']}
Changed Files:
{changed_files}

Git Diff:

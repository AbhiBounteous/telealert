name: Claude DevOps PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        run: |
          git diff --name-only \
            origin/${{ github.base_ref }}...HEAD \
            > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

      - name: Get diff content
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- '*.yaml' '*.yml' '*.tf' '*.py' 'Dockerfile*' \
            > /tmp/pr_diff.txt
          echo "Lines: $(wc -l < /tmp/pr_diff.txt)"

      - name: Install anthropic
        run: pip install anthropic

      - name: Claude DevOps Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - << 'PYEOF'
          import anthropic, os

          client = anthropic.Anthropic()

          with open('/tmp/pr_diff.txt') as f:
              diff = f.read()[:12000]

          with open('/tmp/changed_files.txt') as f:
              changed_files = f.read()

          pr_title = os.environ.get('PR_TITLE', 'No title')

          prompt = (
              "You are a Senior DevOps Engineer reviewing a PR for TeleAlert.\n\n"
              f"PR Title: {pr_title}\n"
              f"Changed Files:\n{changed_files}\n\n"
              f"Git Diff:\n{diff}\n\n"
              "Review for:\n"
              "CRITICAL: hardcoded secrets, :latest tags, root containers\n"
              "HIGH: missing resource limits, missing readinessProbe\n"
              "MEDIUM: missing labels, missing ServiceMonitor\n\n"
              "Format response as:\n"
              "## Claude DevOps PR Review\n"
              "### CRITICAL\n"
              "### HIGH\n"
              "### MEDIUM\n"
              "### Good Patterns\n"
              "### Verdict: APPROVE or REQUEST_CHANGES\n"
          )

          response = client.messages.create(
              model="claude-sonnet-4-6",
              max_tokens=2000,
              messages=[{"role": "user", "content": prompt}]
          )

          review = response.content[0].text
          print(review)

          with open('/tmp/claude_review.txt', 'w') as f:
              f.write(review)
          PYEOF

      - name: Post review as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$(cat /tmp/claude_review.txt)"
EOF
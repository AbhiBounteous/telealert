apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telealert-all-envs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:AbhiBounteous/telealert.git
    targetRevision: HEAD
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telealert
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:AbhiBounteous/telealert.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/metrics
        - /spec/minReplicas
        - /spec/maxReplicas
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telealert-worker-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: telealert-worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - ports:
        - port: 53
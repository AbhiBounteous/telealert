apiVersion: apps/v1
kind: Deployment
metadata:
  name: telealert-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telealert-api
  template:
    metadata:
      labels:
        app: telealert-api
    spec:
      containers:
        - name: api
          image: ghcr.io/abhibounteous/telealert-api:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: telealert
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              value: password
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "250Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"

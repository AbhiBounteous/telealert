apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: dev-
namespace: telealert-dev
resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: telealert_dev
      - op: add
        path: /spec/template/metadata/labels/env
        value: dev
    target:
      kind: Deployment
      name: telealert-api
commonLabels:
  environment: dev
images:
  - name: ghcr.io/abhibounteous/telealert-api
    newTag: latest

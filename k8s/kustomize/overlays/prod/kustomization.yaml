apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: prod-
namespace: telealert-prod
resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: telealert_prod
      - op: add
        path: /spec/template/metadata/labels/env
        value: prod
    target:
      kind: Deployment
      name: telealert-api
commonLabels:
  environment: prod
images:
  - name: ghcr.io/abhibounteous/telealert-api
    newTag: latest

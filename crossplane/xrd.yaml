apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xtelealertdatabases.telealert.bounteous.com
spec:
  group: telealert.bounteous.com
  names:
    kind: XTeleAlertDatabase
    plural: xtelealertdatabases
  claimNames:
    kind: TeleAlertDatabase
    plural: telealertdatabases
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    namespace:
                      type: string
                    dbName:
                      type: string
                    environment:
                      type: string
                      enum: [dev, staging, prod]
                  required:
                    - namespace
                    - dbName
                    - environment

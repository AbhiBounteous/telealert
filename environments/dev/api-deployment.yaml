apiVersion: apps/v1
kind: Deployment
metadata:
  name: telealert-api-dev
  labels:
    app: telealert-api
    env: dev
    version: "2.0"    # add this line
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telealert-api
      env: dev
  template:
    metadata:
      labels:
        app: telealert-api
        env: dev
    spec:
      containers:
        - name: api
          image: ghcr.io/abhibounteous/telealert-api:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: telealert_dev
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              value: password
            - name: ENVIRONMENT
              value: dev
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: telealert-api-dev
  labels:
    env: dev
spec:
  selector:
    app: telealert-api
    env: dev
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30501

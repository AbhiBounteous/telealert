apiVersion: apps/v1
kind: Deployment
metadata:
  name: telealert-api-staging
  labels:
    app: telealert-api
    env: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telealert-api
      env: staging
  template:
    metadata:
      labels:
        app: telealert-api
        env: staging
    spec:
      containers:
        - name: api
          image: ghcr.io/abhibounteous/telealert-api:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: telealert_staging
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              value: password
            - name: ENVIRONMENT
              value: staging
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: telealert-api-staging
  labels:
    env: staging
spec:
  selector:
    app: telealert-api
    env: staging
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30502
